[package]
name = "r2browser"
version = "0.1.0"
description = "A Cloudflare R2 and S3-compatible storage browser"
authors = ["you"]
license = ""
repository = ""
default-run = "r2browser"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2.5.7"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
reqwest = { version = "0.13.2", features = ["json", "rustls", "multipart", "stream"], default-features = false }
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
url = "2.5.8"
uuid = { version = "1.22.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
bytes = "1.11.1"
urlencoding = "2.1.3"
quick-xml = { version = "0.39.2", features = ["serialize"] }

aws-config = "1.8.15"
aws-sdk-s3 = "1.125.0"
aws-credential-types = "1.2.14"
aws-types = "1.3.14"
aws-smithy-runtime-api = "1.11.6"
aws-smithy-types = "1.4.6"

rsa = "0.9.10"
rand = "0.10.0"
pkcs8 = { version = "0.10.2", features = ["pem", "encryption"] }
aes-gcm = "0.10.3"

log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json", "chrono", "local-time"] }
tracing-appender = "0.2.4"
time = { version = "0.3.47", features = ["local-offset", "macros"] }

dirs = "6.0.0"

[features]
default = []

[dev-dependencies]
tempfile = "3.27.0"
