[package]
name = "r2browser"
version = "0.1.1-beta.3"
description = "A Cloudflare R2 and S3-compatible storage browser"
authors = ["BackRunner"]
license = "Apache-2.0"
repository = "https://github.com/backrunner/r2browser"
default-run = "r2browser"
edition = "2021"
rust-version = "1.94.1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
semver = "1.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-shell = "2.3.6"
tauri-plugin-http = "2.6.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
reqwest = { version = "0.13.4", features = ["json", "rustls", "multipart", "stream"], default-features = false }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
bytes = "1.12.1"
urlencoding = "2.1.3"
quick-xml = { version = "0.42.0", features = ["serialize"] }

aws-sdk-s3 = { version = "1.145.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-credential-types = "1.3.0"
aws-types = "1.6.0"
aws-smithy-runtime-api = "1.16.0"
aws-smithy-types = "1.6.3"

rsa = "0.10.0-rc.18"
rand = "0.10.2"
pkcs8 = { version = "0.11.0", features = ["pem", "encryption"] }
aes-gcm = "0.11.1"

log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "chrono", "local-time"] }
tracing-appender = "0.2.5"
time = { version = "0.3.55", features = ["local-offset", "macros"] }

dirs = "6.0.0"

[features]
default = []

[dev-dependencies]
tempfile = "3.27.0"
