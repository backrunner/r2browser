[package]
name = "r2browser"
version = "0.1.0"
description = "A Cloudflare R2 and S3-compatible storage browser"
authors = ["you"]
license = ""
repository = ""
default-run = "r2browser"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8", features = [] }
tauri-plugin-fs = "2.4.2"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-shell = "2.3.1"
tauri-plugin-http = "2.5.2"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.8"
urlencoding = "2.1.3"
quick-xml = { version = "0.38.3", features = ["serialize"] }

# AWS SDK for S3 operations - Latest versions
aws-config = "1.8"
aws-sdk-s3 = "1.106"
aws-credential-types = "1.2"
aws-types = "1.3"
aws-smithy-runtime-api = "1.9.0"
aws-smithy-types = "1.3"

# RSA encryption for secure state storage - Latest versions
rsa = "0.9"
rand = "0.9"
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
aes-gcm = "0.10"

# Additional utilities - Latest versions
dirs = "6.0"
log = "0.4"
env_logger = "0.11"

[features]
default = []

[dev-dependencies]
tempfile = "3"
