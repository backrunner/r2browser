[package]
name = "r2browser"
version = "0.1.0"
description = "A Cloudflare R2 and S3-compatible storage browser"
authors = ["BackRunner"]
license = "Apache-2.0"
repository = "https://github.com/backrunner/r2browser"
default-run = "r2browser"
edition = "2021"
rust-version = "1.91.1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2.5.9"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
reqwest = { version = "0.13.4", features = ["json", "rustls", "multipart", "stream"], default-features = false }
base64 = "0.22.1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.103"
thiserror = "2.0.18"
bytes = "1.12.0"
urlencoding = "2.1.3"
quick-xml = { version = "0.41.0", features = ["serialize"] }

aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
aws-credential-types = "1.2.14"
aws-types = "1.3.16"
aws-smithy-runtime-api = "1.12.3"
aws-smithy-types = "1.5.0"

rsa = "0.10.0-rc.18"
rand = "0.10.2"
pkcs8 = { version = "0.11.0", features = ["pem", "encryption"] }
aes-gcm = "0.11.0"

log = "0.4.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "chrono", "local-time"] }
tracing-appender = "0.2.5"
time = { version = "0.3.53", features = ["local-offset", "macros"] }

dirs = "6.0.0"

[features]
default = []

[dev-dependencies]
tempfile = "3.27.0"
