name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-check:
    name: Desktop Check - ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            run_lint: true
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            run_lint: false
          - platform: macos-latest
            target: aarch64-apple-darwin
            run_lint: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.run_lint
        run: pnpm run lint

      - name: Multi-window regressions
        if: matrix.run_lint
        run: pnpm run test

      - name: Type check
        run: pnpm run check

      - name: Build frontend
        run: pnpm run build

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked --target ${{ matrix.target }}

      - name: Compile Rust tests
        working-directory: src-tauri
        run: cargo test --locked --no-run --target ${{ matrix.target }}

      - name: Run Rust regressions
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}
